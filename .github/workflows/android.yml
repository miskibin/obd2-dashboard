name: Android build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: obd2-dashboard-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Every build on the main working branch updates the rolling "latest"
      # release, so the newest APK is always at a stable browser-friendly URL:
      # https://github.com/miskibin/obd2-dashboard/releases/latest
      # Tagged builds (v*) additionally get their own versioned release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # Otherwise a tagged release is a download with nothing said about it. The commit
          # subjects are the changelog: they are written to be read by somebody deciding
          # whether this build is worth putting on their phone.
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
